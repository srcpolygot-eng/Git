[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pygit-client"
version = "0.2.0"
description = "A pure Python implementation of the Git version control client supporting 75 Git Bash commands."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Git Python Developer", email = "dev@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
pygit = "git.cli:main"
